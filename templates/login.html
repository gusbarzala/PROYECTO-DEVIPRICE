<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPrice - Iniciar Sesión</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .navbar-devprice { background-color: #161b22; border-bottom: 2px solid #238636; }
        .card-custom { background-color: #161b22; border: 1px solid #30363d; }
    </style>
</head>
<body>

    <!-- Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-devprice mb-4 shadow">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-3 text-decoration-none" href="/">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="DevPrice Logo" width="38" height="38" class="d-inline-block">
                <span class="text-white">Dev<span style="color: #00e5ff;">Price</span></span>
            </a>
            <div class="d-flex align-items-center">
                <a href="/" class="btn btn-outline-secondary btn-sm fw-bold">Volver al Catálogo</a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center mt-4">
            <div class="col-md-5">
                
                <!-- Mensajes Flash de alerta -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <!-- Tarjeta de Login -->
                <div class="card card-custom p-4 shadow">
                    <h3 class="text-center text-light fw-bold mb-4">Iniciar Sesión</h3>
                    
                    <form method="POST" action="/login">
                        <div class="mb-3">
                            <label for="email" class="form-label text-light fw-bold">Correo Electrónico</label>
                            <input type="email" class="form-control bg-dark text-light border-secondary" id="email" name="email" placeholder="ejemplo@devprice.com" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label text-light fw-bold">Contraseña</label>
                            <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold py-2">Ingresar</button>
                    </form>

                    <hr class="border-secondary my-4">

                    <div class="text-center">
                        <a href="/" class="text-decoration-none text-secondary small">← Regresar a la página principal</a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
